name: Site Deploy
on:
    push:
        branches:
            - main
    workflow_run:
        workflows: ["Release"]
        types:
            - completed
jobs:
    deploy:
        runs-on: ubuntu-latest
        if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-go@v5
              with:
                go-version: '1.26'
            - run: |
                mkdir -p public
                cp -r site/* public/
                cp web/chest_drops.json public/
                cp -r web/sprites public/
                go run ./cmd/sitegen -site site -out public
                BASE="https://github.com/Rupelio/TBH-Optimizer/releases/latest/download"
                curl -fsSL "$BASE/optimizer.exe" -o public/optimizer.exe || echo "WARN: optimizer.exe ainda nao publicado"
                curl -fsSL "$BASE/version.json" -o public/version.json || echo "WARN: version.json ainda nao e asset do release (ok ate v1.0.47)"

            - uses: cloudflare/wrangler-action@v3
              with:
                apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                command: pages deploy public --project-name=tbh-optimizer
