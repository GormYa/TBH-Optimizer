name: Site Deploy
on:
    push:
        branches:
            - main
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-go@v5
              with:
                go-version: '1.26'
            - run: |
                mkdir -p public
                cp -r site/* public/
                cp web/chest_drops.json public/
                cp -r web/sprites public/
                go run ./cmd/sitegen -site site -out public
                # Cada "pages deploy" substitui a producao INTEIRA. Sem reincluir os
                # artefatos de update, o Site Deploy apagava version.json/optimizer.exe
                # da producao -> auto-update dos exes antigos quebrava (HTML no version.json).
                # Puxa-os do ultimo Release pra que toda producao fique completa.
                BASE="https://github.com/Rupelio/TBH-Optimizer/releases/latest/download"
                curl -fsSL "$BASE/optimizer.exe" -o public/optimizer.exe || echo "WARN: optimizer.exe ainda nao publicado"
                curl -fsSL "$BASE/version.json" -o public/version.json || echo "WARN: version.json ainda nao e asset do release (ok ate v1.0.47)"

            - uses: cloudflare/wrangler-action@v3
              with:
                apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                command: pages deploy public --project-name=tbh-optimizer
