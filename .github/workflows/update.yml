name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-go@v5
              with:
                go-version: '1.26'

            - name: Extract version from tag
              run: |
                echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

            - name: Build optimizer
              run: |
                GOOS=windows GOARCH=amd64 go build \
                -ldflags "-s -w -H=windowsgui \
                -X optimizer/internal.es3Password=${{ secrets.TBH_ES3_KEY }} \
                -X optimizer/internal.Version=1.0.${{ github.run_number }}" \
                -o optimizer.exe .

            - name: Generate site files
              run: |
                mkdir -p public
                cp -r site/* public/
                cp web/chest_drops.json public/
                cp -r web/sprites public/
                go run ./cmd/sitegen -site site -out public
                cp optimizer.exe public/optimizer.exe
                SHA=$(sha256sum optimizer.exe | cut -d' ' -f1)
                GAMEVER=$(python3 -c "import json; print(json.load(open('web/chest_drops.json'))['gameVersion'])")
                echo "$SHA optimizer.exe" > public/SHA256SUMS.txt
                EXE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/optimizer.exe"
                echo "{\"version\":\"1.0.${{ github.run_number }}\",\"exe\":\"$EXE_URL\",\"sha256\":\"$SHA\",\"notes\":\"Dados atualizados\",\"gameVersion\":\"$GAMEVER\"}" > public/version.json

            - name: Create Github Release
              uses: softprops/action-gh-release@v2
              with:
                files: |
                    optimizer.exe
                    public/version.json
                    public/SHA256SUMS.txt

            - name: Deploy Cloudflare Pages
              uses: cloudflare/wrangler-action@v3
              with:
                apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                command: pages deploy public --project-name=tbh-optimizer
